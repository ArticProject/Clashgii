name: Build RoyalePulse APK

on:
  push:
    branches:
      - main
      - master
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Publish RoyalePulse APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify or build RoyalePulse.apk
        run: |
          if [ -f "RoyalePulse.apk" ]; then
            echo "Using pre-built signed RoyalePulse.apk from repository root"
          elif [ -f ".build-outputs/app-debug.apk" ]; then
            cp .build-outputs/app-debug.apk RoyalePulse.apk
          else
            echo "Pre-built RoyalePulse.apk not found"
            exit 1
          fi

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RoyalePulse-APK
          path: RoyalePulse.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases (latest)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "RoyalePulse APK (Прямое скачивание)"
          body: |
            ### 📥 Прямая ссылка на скачивание APK:
            **[Скачать RoyalePulse.apk](https://github.com/${{ github.repository }}/releases/latest/download/RoyalePulse.apk)**
          files: RoyalePulse.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
